<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 32px;
  }
  .wrapper {
    max-width: 600px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    color: #8b1a1a;
    font-weight: 800;
    text-align: center;
    margin-bottom: 28px;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .letter-box {
    width: 90px;
    height: 80px;
    background: #e8b4a8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    color: #8b1a1a;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .arrow {
    width: 50px;
    height: 40px;
    position: relative;
    flex-shrink: 0;
  }
  .arrow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 28px;
    height: 16px;
    background: #e8b4a8;
    transform: translateY(-50%);
  }
  .arrow::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 4px;
    width: 0;
    height: 0;
    border-top: 20px solid transparent;
    border-bottom: 20px solid transparent;
    border-left: 22px solid #e8b4a8;
    transform: translateY(-50%);
  }
  .description {
    font-size: 20px;
    color: #333;
    padding-left: 4px;
    line-height: 1.35;
  }
  .description strong {
    color: #8b1a1a;
    font-weight: 700;
  }
  .description .sub {
    font-size: 16px;
    color: #666;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="wrapper">
  <h1>Persistent neutropenic fever</h1>
  <div class="rows">

    <div class="row">
      <div class="letter-box">F</div>
      <div class="arrow"></div>
      <div class="description"><strong>False</strong> diagnosis</div>
    </div>

    <div class="row">
      <div class="letter-box">A</div>
      <div class="arrow"></div>
      <div class="description"><strong>Allergy</strong></div>
    </div>

    <div class="row">
      <div class="letter-box">I</div>
      <div class="arrow"></div>
      <div class="description"><strong>Infections</strong> with<br>resistant pathogens</div>
    </div>

    <div class="row">
      <div class="letter-box">L</div>
      <div class="arrow"></div>
      <div class="description"><strong>Localized</strong> problems<br><span class="sub">(i.e. prosthetic materials)</span></div>
    </div>

  </div>
</div>

</body>
</html>

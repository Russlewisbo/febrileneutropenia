name: Render Quarto Slides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.qmd"
      - "**.bib"
      - "**.scss"
      - "_extensions/**"
      - "images/**"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render lecture slides
        run: |
          quarto render Febrileneutropenia_lecture.qmd
          quarto render Lecture1.qmd

      - name: Commit and push rendered HTML
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Febrileneutropenia_lecture.html Lecture1.html
          git diff --staged --quiet || git commit -m "Auto-render slides [skip ci]"
          git push
